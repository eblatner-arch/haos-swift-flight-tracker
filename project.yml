name: FlightTracker
options:
  bundleIdPrefix: com.ericsflights
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # pick your team in Xcode (Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
targets:
  FlightTracker:
    type: application
    platform: iOS
    sources:
      - FlightTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericsflights.flighttracker
        PRODUCT_NAME: Flights
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlightTracker/Info.plist
      properties:
        CFBundleDisplayName: Flights
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Reaches your Home Assistant add-on on your home network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ericsflights.flighttracker
            CFBundleURLSchemes: [flighttracker]
