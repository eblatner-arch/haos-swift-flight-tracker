# Compiles the app on a Mac (no signing) on every push, so build errors show up here.
name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project FlightTracker.xcodeproj -scheme FlightTracker \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80
